<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chivo:wght@400;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="wrap" id="app">
  <div class="top">
    <h1 id="date">…</h1>
    <div class="meta"><span id="sync">reading the database</span>
      <a href="/bloods">bloods</a>
      <button type="button" id="refresh">refresh</button></div>
  </div>
  <div id="body"></div>
  <footer id="foot"></footer>
</div>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, html) => {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (html !== undefined) node.innerHTML = html;
  return node;
};
const fmt = (v, places = 1) =>
  v === null || v === undefined ? "—" : (typeof v === "number" ? String(Number(v.toFixed(places))) : v);
const sig = (v) =>
  v === null || v === undefined ? "—" : String(Number(v.toPrecision(4)));

function zLabel(z, n) {
  if (z === null || z === undefined) return `<span class="flat">no baseline yet</span>`;
  const cls = Math.abs(z) < 1 ? "flat" : (z > 0 ? "up" : "down");
  return `<span class="${cls}">${z > 0 ? "+" : ""}${z.toFixed(1)} SD</span> · ${n}d`;
}

/* ---------- the chart: 28 days, its baseline band, and the phase ---------- */
function chart(data) {
  const points = data.points.filter(p => p.value !== null);
  if (points.length < 2) return el("p", "caption", "Not enough days to draw yet.");

  const w = 900, h = 140, pad = 18;
  const values = points.map(p => p.value);
  const min = Math.min(...values), max = Math.max(...values), span = (max - min) || 1;
  const x = i => pad + (i / (points.length - 1)) * (w - pad * 2);
  const y = v => pad + (1 - (v - min) / span) * (h - pad * 2);

  let band = "";
  if (data.usable) {
    const top = y(data.median + data.mad), bottom = y(data.median - data.mad);
    band = `<rect x="${pad}" y="${top}" width="${w - pad * 2}" height="${bottom - top}"
                  fill="var(--soft)" opacity="0.13"></rect>
            <line x1="${pad}" y1="${y(data.median)}" x2="${w - pad}" y2="${y(data.median)}"
                  stroke="var(--soft)" stroke-width="1" stroke-dasharray="4 4"></line>`;
  }

  // Shade the run of days sharing the final day's cycle phase.
  let phase = "";
  const current = points[points.length - 1].phase;
  if (current) {
    let from = points.length - 1;
    while (from > 0 && points[from - 1].phase === current) from--;
    phase = `<rect x="${x(from)}" y="${pad - 8}" width="${w - pad - x(from)}"
                   height="${h - pad * 2 + 16}" fill="var(--signal)" opacity="0.06"></rect>
             <text x="${x(from) + 8}" y="${pad + 2}" font-size="11" fill="var(--signal)"
                   font-family="JetBrains Mono, monospace">${current.toUpperCase()}</text>`;
  }

  const line = points.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)} ${y(p.value).toFixed(1)}`).join(" ");
  const hi = values.indexOf(max), lo = values.indexOf(min);
  const lastX = x(points.length - 1), lastY = y(values[values.length - 1]);

  const box = el("div");
  box.innerHTML = `
    <svg viewBox="0 0 ${w} ${h}" width="100%" height="${h}" role="img"
         aria-label="${data.metric} over ${points.length} days, latest ${values[values.length - 1]} ${data.unit}">
      ${phase}${band}
      <path d="${line}" fill="none" stroke="var(--signal)" stroke-width="2"></path>
      <circle cx="${lastX}" cy="${lastY}" r="4" fill="var(--signal)"></circle>
      <text x="${x(hi) + 7}" y="${y(max) + 4}" font-size="11" fill="var(--soft)"
            font-family="JetBrains Mono, monospace">${fmt(max)}</text>
      <text x="${x(lo) + 7}" y="${y(min) + 4}" font-size="11" fill="var(--soft)"
            font-family="JetBrains Mono, monospace">${fmt(min)}</text>
      <text x="${lastX - 8}" y="${lastY - 11}" font-size="11.5" text-anchor="end"
            fill="var(--ink)" font-family="JetBrains Mono, monospace">${fmt(values[values.length - 1])} ${data.unit}</text>
    </svg>`;
  return box;
}

/* ---------- modules ---------- */
function readout(items, load) {
  const grid = el("div", "readout");
  items.forEach(item => {
    const cell = el("div", "cell");
    cell.appendChild(el("div", "k", item.label));
    cell.appendChild(el("div", "v", item.value === null || item.value === undefined
      ? "—" : `${item.value}${item.unit ? `<u> ${item.unit}</u>` : ""}`));
    cell.appendChild(el("div", item.value === null && item.hint ? "hint" : "d",
      item.value === null || item.value === undefined
        ? (item.hint || "no data") : zLabel(item.z, item.baseline_n)));
    grid.appendChild(cell);
  });
  const cell = el("div", "cell");
  cell.appendChild(el("div", "k", "Load 7d:28d"));
  cell.appendChild(el("div", "v", load.ratio === null ? "—" : load.ratio.toFixed(2)));
  cell.appendChild(el("div", "d", load.ratio === null ? "no training yet"
    : load.summary.split(":")[0]));
  grid.appendChild(cell);
  return grid;
}

function strength(rows) {
  const box = el("div");
  box.appendChild(el("div", "colhead", "Strength · estimated 1RM"));
  if (!rows.length) {
    box.appendChild(el("p", "caption", "No lifting data yet.<br>health sync hevy"));
    return box;
  }
  rows.forEach(lift => {
    const row = el("div", "row");
    row.appendChild(el("div", "name",
      `${lift.exercise} <em>· ${lift.sessions} session${lift.sessions === 1 ? "" : "s"}</em>`));
    let fig;
    if (lift.trend === null || lift.trend === undefined) {
      fig = `<span class="flat">${lift.note ? "too few sessions" : "—"}</span>`;
    } else {
      const cls = lift.trend > 0.05 ? "up" : lift.trend < -0.05 ? "down" : "flat";
      const arrow = lift.trend > 0 ? "↑" : lift.trend < 0 ? "↓" : "→";
      fig = `<span class="${cls}">${arrow} ${Math.abs(lift.trend).toFixed(2)} kg/wk</span>` +
            ` · r² ${lift.r2 === null ? "—" : lift.r2.toFixed(2)}`;
    }
    if (lift.stale) fig += `<span class="tag stale">stale</span>`;
    row.appendChild(el("div", "fig", fig));
    box.appendChild(row);
  });
  return box;
}

function bloods(data) {
  const box = el("div");
  box.appendChild(el("div", "colhead",
    data.results.length
      ? `Bloods · ${new Date(data.date + "T00:00").toLocaleDateString(undefined,
          { day: "numeric", month: "short" })}`
      : "Bloods"));
  if (!data.results.length) {
    box.appendChild(el("p", "caption", `No panels yet.<br>${data.hint}`));
    return box;
  }
  data.results.forEach(result => {
    const row = el("div", "row");
    row.appendChild(el("div", "name", result.label));
    const tag = result.flag === "low" || result.flag === "high"
      ? `<span class="tag ${result.flag}">${result.flag}</span>` : "";
    row.appendChild(el("div", "fig",
      `${sig(result.value)} ${result.unit || ""}${tag}`));
    box.appendChild(row);
  });
  const flagged = data.flagged || 0;
  box.appendChild(el("p", "caption",
    `${flagged} of ${data.total} outside range` +
    (data.results.some(r => r.range_source === "generic")
      ? " · some ranges are generic, not your lab's" : "")));
  return box;
}

/* ---------- readiness, protocol, check-in, experiments ---------- */
function protocolBanner(protocol) {
  if (!protocol || !protocol.on || !protocol.on.length) return null;
  const box = el("div", "banner");
  const pills = protocol.on.map(a => {
    const dose = (a.weekly_dose !== null && a.weekly_dose !== undefined)
      ? `${a.weekly_dose}${a.unit || ""}/wk` : "";
    return `${a.label} ${dose} · wk ${Math.round(a.weeks_on)}`;
  }).join(" · ");
  box.innerHTML = `<span class="tag">on</span> ${pills}`;
  return box;
}

function illnessAlert(watch) {
  if (!watch || watch.flag !== "watch") return null;
  const box = el("div", "alert");
  box.textContent = `⚠ ${watch.note}`;
  return box;
}

function readinessSection(readiness) {
  if (!readiness || !readiness.recommendation) return null;
  const box = el("section");
  const cls = { push: "good", proceed: "ink", hold: "warn", pull_back: "bad" }
    [readiness.recommendation] || "ink";
  const head = el("div", "head");
  head.appendChild(el("h3", null, "Readiness"));
  head.appendChild(el("div", `call ${cls}`, readiness.recommendation.replace("_", " ")));
  box.appendChild(head);
  box.appendChild(el("p", "caption", readiness.advice || ""));
  const reasons = (readiness.reasons || []).concat(readiness.context || []);
  reasons.forEach(r => box.appendChild(el("p", "caption", "— " + r)));
  return box;
}

function sixWeekTrends(trends) {
  if (!trends || !trends.length) return null;
  const box = el("div");
  box.appendChild(el("div", "colhead", "Six-week drift"));
  trends.forEach(t => {
    const row = el("div", "row");
    row.appendChild(el("div", "name", t.metric.replace(/_/g, " ")));
    const cls = t.verdict === "rising" ? "up" : t.verdict === "falling" ? "down" : "flat";
    row.appendChild(el("div", "fig",
      `<span class="${cls}">${t.verdict}</span> · ${fmt(t.slope_per_week, 3)}/wk`));
    box.appendChild(row);
  });
  return box;
}

function sleepArchitecture(arch) {
  if (!arch || !arch.components) return null;
  const shown = arch.components.filter(c => c.last_night !== null && c.last_night !== undefined);
  if (!shown.length) return null;
  const box = el("div");
  box.appendChild(el("div", "colhead", "Sleep architecture"));
  shown.forEach(c => {
    const row = el("div", "row");
    row.appendChild(el("div", "name", c.label));
    const cls = c.verdict === "ordinary" ? "flat" : (c.verdict === "high" ? "up" : "down");
    row.appendChild(el("div", "fig", `${fmt(c.last_night)} <span class="${cls}">` +
      `${c.z !== null && c.z !== undefined ? (c.z > 0 ? "+" : "") + c.z.toFixed(1) + " SD" : "—"}</span>`));
    box.appendChild(row);
  });
  if (arch.deep_sleep_debt_min) {
    box.appendChild(el("p", "caption",
      `deep-sleep debt ${fmt(arch.deep_sleep_debt_min, 0)} min over the window`));
  }
  return box;
}

function checkinSection(checkin, bp) {
  const rows = (checkin && checkin.rows) || [];
  if (!rows.length && !(bp && bp.verdict)) return null;
  const box = el("div");
  box.appendChild(el("div", "colhead", "Check-in"));
  if (bp && bp.verdict) {
    const row = el("div", "row");
    row.appendChild(el("div", "name", "Blood pressure"));
    const cls = bp.verdict === "see a doctor" ? "attention" : bp.verdict === "watch" ? "watch" : "ok";
    const tag = cls ? `<span class="tag ${cls}">${bp.verdict}</span>` : bp.verdict;
    row.appendChild(el("div", "fig",
      `${fmt(bp.average_systolic, 0)}/${fmt(bp.average_diastolic, 0)} ${tag}`));
    box.appendChild(row);
  }
  rows.forEach(r => {
    const row = el("div", "row");
    row.appendChild(el("div", "name", r.dimension));
    const cls = r.agreement === "match" ? "flat" : "down";
    row.appendChild(el("div", "fig", `${r.you_said}/5 <span class="${cls}">${r.agreement}</span>`));
    box.appendChild(row);
  });
  if (checkin && checkin.note) box.appendChild(el("p", "caption", `"${checkin.note}"`));
  return box;
}

function experimentsStrip(experiments) {
  if (!experiments || !experiments.length) return null;
  const box = el("div");
  box.appendChild(el("div", "colhead", "Experiments"));
  experiments.forEach(e => {
    const row = el("div", "row");
    row.appendChild(el("div", "name", `${e.hypothesis} <em>· ${e.status}</em>`));
    row.appendChild(el("div", "fig", e.condition
      ? `${e.condition} · day ${e.day_in_block}/${e.block_days}` : "—"));
    box.appendChild(row);
    // `analyse` always returns a verdict, even "too early" with no blocks
    // collected yet — show it as a quiet caption under the row.
    if (e.analysis && e.analysis.verdict) {
      box.appendChild(el("p", "caption", e.analysis.verdict));
    }
  });
  return box;
}

/* ---------- weekly research ---------- */
function weeklyResearchSection(research) {
  if (!research || !research.pattern) return null;
  const box = el("section");
  box.appendChild(el("h3", null, "This week's pattern"));
  box.appendChild(el("p", "caption", research.pattern));
  if (research.error) {
    box.appendChild(el("p", "caption", `literature search failed: ${research.error}`));
    return box;
  }
  if (!research.papers || !research.papers.length) {
    box.appendChild(el("p", "caption", "no matching literature found"));
    return box;
  }
  research.papers.forEach(p => {
    const row = el("div", "row");
    const title = p.url ? `<a href="${p.url}" target="_blank" rel="noopener">${p.title}</a>` : p.title;
    row.appendChild(el("div", "name", title));
    const bits = [p.design, p.journal, p.year].filter(Boolean).join(" · ");
    row.appendChild(el("div", "fig", `${bits}${p.cited_by ? ` · ${p.cited_by} cites` : ""}`));
    box.appendChild(row);
  });
  return box;
}

function setup(sync) {
  const box = el("div", "setup");
  box.appendChild(el("h2", null, "Nothing synced yet."));
  box.appendChild(el("p", null,
    "Connect a source and this page fills in. Everything stays on this machine."));
  const steps = [
    ["Hevy", "Copy the key from hevy.com/settings?developer", "health sync hevy"],
    ["WHOOP", "Create an app at developer.whoop.com, redirect http://localhost:8765/callback",
     "health auth whoop &amp;&amp; health sync whoop"],
    ["Apple Health", "Health Auto Export → iCloud Drive, then point HEALTH_APPLE_EXPORT_DIR at it",
     "health sync apple_health"],
    ["Blood tests", "A PDF report or a CSV", "health labs add report.pdf"],
  ];
  steps.forEach(([name, why, command], index) => {
    const step = el("div", "step");
    step.appendChild(el("div", "n", String(index + 1)));
    step.appendChild(el("div", "what", `<b>${name}</b> — ${why}<code>${command}</code>`));
    box.appendChild(step);
  });
  return box;
}

/* ---------- render ---------- */
function render(data) {
  const body = $("body");
  body.innerHTML = "";

  if (data.error) {
    $("date").textContent = "health";
    body.appendChild(el("p", "err", data.error));
    return;
  }

  $("date").textContent = data.date_label;
  const connected = data.sync.connected.filter(s => s !== "labs");
  $("sync").textContent = connected.length
    ? `synced · ${connected.join(", ")}` : "no sources connected";

  if (data.empty) {
    body.appendChild(setup(data.sync));
    $("foot").textContent = "health serve · 127.0.0.1 only";
    return;
  }

  if (data.showing_older_day) {
    body.appendChild(el("p", "caption",
      `Nothing has synced for today — showing ${data.showing_older_day}, the most recent day with data.`));
  }

  const banner = protocolBanner(data.protocol);
  if (banner) body.appendChild(banner);
  const alertBox = illnessAlert(data.illness_watch);
  if (alertBox) body.appendChild(alertBox);

  const verdict = el("div", "verdict");
  const left = el("div");
  left.appendChild(el("h2", null, data.verdict.headline));
  left.appendChild(el("p", null, data.verdict.detail));
  verdict.appendChild(left);
  const recovery = data.readout.find(r => r.metric === "recovery_score");
  if (recovery && recovery.value !== null && recovery.value !== undefined) {
    const score = el("div", "score");
    score.innerHTML = `<span class="num">${recovery.value}</span><small>recovery</small>`;
    verdict.appendChild(score);
  }
  body.appendChild(verdict);

  body.appendChild(readout(data.readout.filter(r => r.metric !== "recovery_score"), data.load));

  const readinessBox = readinessSection(data.readiness);
  if (readinessBox) body.appendChild(readinessBox);

  const strip = el("section");
  const head = el("div", "head");
  head.appendChild(el("h3", null, `${data.chart.metric} · ${data.chart.points.length} days against baseline`));
  const cycle = data.cycle || {};
  head.appendChild(el("div", "mono", cycle.cycle_day
    ? `day ${cycle.cycle_day} · ${cycle.phase}` : ""));
  strip.appendChild(head);
  strip.appendChild(chart(data.chart));
  strip.appendChild(el("p", "caption", data.chart.usable
    ? `Band is the ${data.chart.points.length}-day median ±1 MAD. The day being judged is not part of its own baseline.`
    : "Not enough history for a baseline band yet."));
  body.appendChild(strip);

  const smallCharts = el("section", "cols");
  [data.load_chart, data.sleep_debt_chart].forEach(c => {
    if (!c || c.points.filter(p => p.value !== null).length < 2) return;
    const box = el("div");
    box.appendChild(el("div", "colhead", `${c.metric} · ${c.points.length} days`));
    box.appendChild(chart(c));
    smallCharts.appendChild(box);
  });
  if (smallCharts.children.length) body.appendChild(smallCharts);

  const trendsBox = sixWeekTrends(data.six_week_trends);
  const sleepBox = sleepArchitecture(data.sleep_architecture);
  if (trendsBox || sleepBox) {
    const driftCols = el("section", "cols");
    if (trendsBox) driftCols.appendChild(trendsBox);
    if (sleepBox) driftCols.appendChild(sleepBox);
    body.appendChild(driftCols);
  }

  const checkinBox = checkinSection(data.check_in, data.blood_pressure);
  const expBox = experimentsStrip(data.experiments);
  if (checkinBox || expBox) {
    const noteCols = el("section", "cols");
    if (checkinBox) noteCols.appendChild(checkinBox);
    if (expBox) noteCols.appendChild(expBox);
    body.appendChild(noteCols);
  }

  const researchBox = weeklyResearchSection(data.weekly_research);
  if (researchBox) body.appendChild(researchBox);

  const cols = el("section", "cols");
  cols.appendChild(strength(data.strength));
  cols.appendChild(bloods(data.bloods));
  body.appendChild(cols);

  const missing = data.sync.missing;
  $("foot").innerHTML = missing.length
    ? `not connected: <b>${missing.join(", ")}</b> — ${missing.map(s => data.sync.hints[s]).join(" · ")}`
    : "all sources connected · 127.0.0.1 only";
}

async function load() {
  try {
    const response = await fetch("/api/today");
    render(await response.json());
  } catch (error) {
    render({ error: String(error) });
  }
}

$("refresh").addEventListener("click", load);
window.addEventListener("focus", load);
load();
</script>
</body>
</html>
