[project]
name = "health"
version = "0.1.0"
description = "A local-first personal health data warehouse and analysis agent"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "httpx>=0.27",
    "pydantic>=2.7",
    # DuckDB converts TIMESTAMPTZ back to Python through pytz; without it every
    # query that selects a timestamp column fails at fetch time.
    "pytz>=2024.1",
    # Lab reports arrive as PDFs more often than as anything structured.
    "pypdf>=4.0",
    # The tool surface the agent talks to.
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
health = "health.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["health"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
